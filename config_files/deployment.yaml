apiVersion: apps/v1
kind: Deployment
metadata:
 name: eco-demo
spec:
 replicas: 60
 selector:
  matchLabels:
   app: eco-demo
 template:
  metadata:
   labels:
    app: eco-demo
   annotations:
    cw-scheduler/opt-in: "true"
  spec:
   schedulerName: cwScheduler
   containers:
     - name: demo
       image: nginx
       resources: 
        requests: {cpu: 500m, memory: 256Mi}
